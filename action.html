  <head>

    <!-- HEADER -->

<!-- NAV -->

        <a href="#home" class="active">Home</a>

    <!-- Action Button -->
   <main>
        <h2 id="page-title">Filters</h2>

        <p id="page-description">
            Select your filters below.
        </p> 

   <div class="filter-list">
    <h2>Filter Programs</h2>

<!-- Filter List -->
    <label>
        <input type="checkbox" name="format" value="in-person">
        In-person
    </label>

    <label>
        <input type="checkbox" name="format" value="online">
        Online
    </label>

    <label>
        <input type="checkbox" name="format" value="hybrid">
        Hybrid
    </label>

    <label>
        <input type="checkbox" name="housing" value="available">
        Housing Available
    </label>

    <label>
        <input type="checkbox" name="degree" value="masters">
        Master's
    </label>

    <label>
        <input type="checkbox" name="degree" value="doctorate">
        Doctorate's
    </label>
</div>  

 </main>
